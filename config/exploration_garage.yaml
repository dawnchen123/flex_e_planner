# FLEX-E configuration for the official AEDE Garage simulator.
# The topic names intentionally match dsvp_launch/config/exploration_garage.yaml
# so either planner can be attached to the same AEDE system_garage.launch.

# AEDE public data/control contract.
terrain_topic: /terrain_map_ext
registered_scan_topic: /registered_scan
scan_state_estimation_topic: /state_estimation_at_scan
state_estimation_topic: /state_estimation
waypoint_topic: /way_point
runtime_topic: /runtime
exploration_finish_topic: /exploration_finish
stop_exploring_topic: /stop_exploring
frame_id: map

# Multi-level observed-support graph.
grid_resolution_m: 0.50
z_resolution_m: 0.25
max_slope_deg: 20.0
max_step_m: 0.25
safe_intensity_m: 0.15
vehicle_height_m: 0.75
max_graph_cells: 160000
max_search_nodes: 5000
frontier_search_range_m: 25.0
# Only after the local search fails, search the retained observed graph for a
# distant frontier that is connected by known traversable support.
global_frontier_search_range_m: 120.0
global_max_search_nodes: 30000

# Closed-loop target selection.  Goals are only observed support cells and
# are forwarded directly to AEDE's existing localPlanner/pathFollower.
planner_period_s: 0.25
# A true frontier is an information target. The command sent to AEDE remains a
# safe observed support cell inside the frontier.
minimum_goal_distance_m: 3.0
cleanup_goal_distance_m: 0.75
visited_radius_m: 1.0
visited_vertical_tolerance_m: 0.50
visited_penalty: 1.0
visit_sample_distance_m: 0.75
execution_horizon_m: 5.0
frontier_standoff_m: 1.5
max_frontier_gain: 8
min_frontier_support_neighbors: 2
completed_reopen_unknown_columns: 6
global_goal_reached_m: 1.5
blocked_subgoal_radius_m: 0.75
blocked_subgoal_memory_s: 60.0
# Path length is a cost. Heading is only a weak tie breaker.
frontier_distance_reward: -0.05
frontier_heading_reward: 0.30
active_goal_min_hold_s: 2.0
active_goal_reached_m: 1.20
active_goal_stall_s: 12.0
active_goal_timeout_s: 30.0
progress_epsilon_m: 0.25

# Transient spatial aggregation is used only to score a physical frontier
# region. It has no persistent cluster ID or retry/age lifecycle.
frontier_cluster_link_m: 1.0
frontier_cluster_vertical_tolerance_m: 0.75
frontier_cluster_gain_reward: 0.20
frontier_observation_wait_s: 0.5
frontier_progress_radius_m: 3.0
frontier_min_growth_cells: 20
map_growth_min_cells: 5

# Sparse 3-D visibility/occupancy evidence. Ray interiors are free, returns are
# occupied, and untouched voxels remain unknown.
occupancy_resolution_m: 0.50
occupancy_ray_step_m: 0.50
occupancy_min_range_m: 0.75
occupancy_max_range_m: 15.0
occupancy_max_rays: 900
occupancy_occupied_threshold: 2
occupancy_free_threshold: -1
occupancy_obstacle_inflation_m: 0.60
# Hard graph traversal footprint. AEDE local_planner uses a 0.6 x 0.6 m
# envelope, whose turning circumradius is 0.424 m; 0.45 m retains a small
# safety margin without disconnecting valid garage doorways. Goal stopping
# clearance below is intentionally larger.
hard_traversal_clearance_m: 0.45
occupancy_min_clearance_m: 0.30
occupancy_max_clearance_m: 1.60
# The previous 400k cap was reached during the Garage run and started evicting
# old visibility evidence, turning known corridors back into UNKNOWN. Keep a
# full-garage budget so physical completion remains stable.
occupancy_max_voxels: 1200000
visibility_update_period_s: 0.50
visibility_min_voxels: 100
occupancy_growth_min_voxels: 20

# A missing terrain neighbor is a frontier only if its clearance corridor has
# enough unknown columns and contains no inflated occupied column.
frontier_lookahead_m: 4.0
frontier_lateral_m: 1.0
frontier_min_unknown_columns: 3

# TARE-style region coverage layer. Frontier clusters remain transient, while
# completion and retry state are attached to fixed XYZ subspaces. Completion
# uses visible traversable support plus real frontiers; obstacle surfaces never
# become exploration goals.
region_size_m: 8.0
region_height_m: 3.0
region_open_frontier_points: 1
region_close_frontier_points: 1
region_reopen_frontier_points: 1
region_coverage_complete_ratio: 0.92
region_coverage_min_uncovered_cells: 6
region_reopen_new_cells: 12
region_close_audits: 2
region_reopen_audits: 2
region_unselectable_close_audits: 2
region_blocked_frontier_audits: 5
region_orphan_close_audits: 3
region_defer_retry_s: 15.0
region_max_failures: 3

# Free-space coverage and interior viewpoints. A registered scan covers every
# support cell that lies within range and has an inflated-column line of sight.
# Incomplete regions are viewed from high-clearance interior cells, not walls.
support_coverage_resolution_m: 0.50
support_coverage_range_m: 12.0
support_coverage_max_cells: 200000
support_coverage_min_known_fraction: 0.65
coverage_max_points_per_region: 256
coverage_candidate_limit: 32
coverage_min_viewpoint_gain: 6
coverage_min_observation_gain: 4
# Predicted cleanup gain must already have partial free-space support. This
# removes the repeated predicted-gain/actual-zero trips seen in the trace.
coverage_prediction_min_known_fraction: 0.35
coverage_gain_reward: 2.0
clearance_search_m: 3.0
minimum_waypoint_clearance_m: 0.75
# Expansion points inside valid corridors may use a smaller stopping margin;
# it remains above the 0.45 m hard vehicle-footprint constraint.
minimum_frontier_waypoint_clearance_m: 0.55
waypoint_clearance_reward: 1.25

# When the selected region lies outside the current closed subspace, advance
# through its graph boundary and command a safe point beyond the threshold.
# Occupancy inflation remains the hard minimum passage-width constraint.
portal_exit_distance_m: 1.5
portal_exit_search_m: 10.0

# Layer- and direction-aware physical completion mask.
completed_region_resolution_m: 1.0
completed_region_radius_m: 3.0
completed_region_progress_radius_m: 1.5
completed_region_vertical_tolerance_m: 0.75

# Reachable-space closure audit. A fresh empty search is not a deferred
# frontier retry: no old candidate identity is retained.
frontier_search_period_s: 5.0
global_audit_period_s: 10.0
completion_map_quiet_s: 20.0
completion_stable_audits: 3
completion_search_range_m: 200.0
completion_max_search_nodes: 160000
completion_min_reachable_cells: 100
no_frontier_finish_s: 20.0
minimum_exploration_s: 120.0
max_exploration_s: 3600.0
shutdown_on_finish: false
finish_shutdown_delay_s: 2.0
trace_idle_period_s: 2.0
seed: 0
publish_debug_clouds: true

# Optional append-only diagnostics; empty disables file output.
decision_trace_path: ""
